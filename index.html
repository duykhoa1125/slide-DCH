<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="data:," />
  <title>Dinh dưỡng - đề phòng độc tố · Slide thuyết trình</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/slides-fit.css" />
  <link rel="stylesheet" href="styles/animations.css" />
  <link rel="stylesheet" href="styles/print.css" />
</head>
<body>
  <div id="progress"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="sketch" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3" />
      </filter>
    </defs>
  </svg>

  <div id="viewport">
    <div id="stage"></div>
  </div>

  <button class="edge" id="edgeL" aria-label="Slide trước"><span>‹</span></button>
  <button class="edge" id="edgeR" aria-label="Slide tiếp theo"><span>›</span></button>

  <button class="corner-btn" id="btnToc" aria-label="Mở mục lục slide" title="Mục lục">☰</button>
  <button class="corner-btn" id="btnFs" aria-label="Toàn màn hình" title="Toàn màn hình">⛶</button>

  <div id="toc" role="dialog" aria-label="Mục lục slide">
    <button id="tocClose">✕ Đóng</button>
    <div class="toc-top">
      <h2 id="tocTitle">Mục lục · 53 slide</h2>
      <button id="btnSrc" type="button" aria-label="Mở danh mục nguồn trích dẫn">Nguồn tài liệu</button>
    </div>
    <div class="grid" id="tocGrid"></div>
  </div>

  <div id="srcModal" role="dialog" aria-label="Danh mục nguồn trích dẫn">
    <button id="srcClose">✕ Đóng</button>
    <h2>Danh mục nguồn &amp; đối chiếu hình ảnh</h2>
    <p class="src-intro">Toàn bộ đường dẫn và chú thích dưới đây được giữ nguyên từ 5 tài liệu thành viên đã nộp; các ảnh minh họa không nằm trong tài liệu gốc được ghi rõ trạng thái chưa xác định URL.</p>
    <div id="srcContent"></div>
  </div>

  <div id="imgZoom" role="dialog" aria-label="Phóng to hình ảnh">
    <img id="imgZoomPic" src="" alt="" />
    <p id="imgZoomCap"></p>
  </div>

  <!-- Nội dung từng phần slide (sửa trực tiếp trong slides/, mở/F5 index.html để xem ngay) -->
  <script defer src="slides/01-mo-dau-ly-thuyet.js"></script>
  <script defer src="slides/02-dinh-duong.js"></script>
  <script defer src="slides/03-nganh-hoa.js"></script>
  <script defer src="slides/04-xay-dung-dien.js"></script>
  <script defer src="slides/05-moi-truong.js"></script>
  <script defer src="slides/06-ket-luan.js"></script>

  <!-- Doodle vẽ tay, nguồn & điều khiển trình chiếu -->
  <script defer src="scripts/doodles.js"></script>
  <script defer src="scripts/sources.js"></script>
  <script defer src="scripts/deck.js"></script>
</body>
</html>
